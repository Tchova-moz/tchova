<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tchova - Mototaxista</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f1f3f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:600px;
  margin:25px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

h1,h2{
  margin-top:0;
}

.info{
  font-size:17px;
  line-height:1.7;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
}

button:active{
  transform:scale(.98);
}

.status{
  background:#fff3cd;
  padding:14px;
  border-radius:12px;
  margin-top:15px;
  font-size:16px;
}

.vazio{
  text-align:center;
  padding:30px 10px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <h1>🛵 TCHOVA</h1>
  <p>Painel do Mototaxista</p>
</header>

<div class="container">

  <div class="card">
    <h2>📋 Pedidos disponíveis</h2>

    <div id="pedido"></div>
  </div>

</div>

<script>

const pedidoDiv = document.getElementById("pedido");

function carregarPedido(){

  const pedidoGuardado =
    localStorage.getItem("tchovaTripRequest");

  if(!pedidoGuardado){

    pedidoDiv.innerHTML =
      '<div class="vazio">Nenhum pedido de viagem disponível.</div>';

    return;
  }

  const pedido = JSON.parse(pedidoGuardado);

  if(pedido.status !== "A procurar mototaxista..."){

    pedidoDiv.innerHTML =
      '<div class="vazio">Nenhum pedido novo disponível.</div>';

    return;
  }

  pedidoDiv.innerHTML = `
    <div class="info">
      📍 <b>Destino:</b> ${pedido.destinationName}<br>
      💳 <b>Pagamento:</b> ${pedido.payment}<br>
      📏 <b>Distância:</b> ${pedido.distanceKm} km<br>
      💰 <b>Tarifa:</b> ${pedido.estimatedFare} MT
    </div>

    <div class="status">
      🟡 Passageiro está à procura de mototaxista.
    </div>

    <button onclick="aceitarViagem()">
      🛵 ACEITAR VIAGEM
    </button>
  `;
}

function aceitarViagem(){

  const pedidoGuardado =
    localStorage.getItem("tchovaTripRequest");

  if(!pedidoGuardado){
    carregarPedido();
    return;
  }

  const pedido = JSON.parse(pedidoGuardado);

  pedido.status = "Mototaxista encontrado";
  pedido.driverAcceptedAt = new Date().toISOString();

  localStorage.setItem(
    "tchovaTripRequest",
    JSON.stringify(pedido)
  );

  pedidoDiv.innerHTML = `
    <div class="status">
      🟢 <b>Viagem aceite!</b><br><br>
      O mototaxista aceitou o pedido do passageiro.
    </div>
  `;
}

carregarPedido();

setInterval(carregarPedido,3000);

</script>

</body>
  </html>
