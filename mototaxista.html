<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tchova - Mototaxista</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f1f3f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:600px;
  margin:25px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

h1,h2{
  margin-top:0;
}

.info{
  font-size:17px;
  line-height:1.7;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:15px;
}

button:active{
  transform:scale(.98);
}

.status{
  background:#fff3cd;
  padding:14px;
  border-radius:12px;
  margin-top:15px;
  font-size:16px;
}

.vazio{
  text-align:center;
  padding:30px 10px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <h1>🛵 TCHOVA</h1>
  <p>Painel do Mototaxista</p>
</header>

<div class="container">

  <div class="card">
    <h2>📋 Pedidos disponíveis</h2>

    <div id="pedido"></div>
  </div>

</div>

<script>
const pedidoDiv = document.getElementById("pedido");

const firebaseBase =
"https://tchova-62cb7-default-rtdb.europe-west1.firebasedatabase.app/pedidos/";

let pedidoRecusadoId = null;
let viagemAceiteId = null;

async function carregarPedidos(){

    try{

        const resposta = await fetch(firebaseBase + ".json");

        if(!resposta.ok){
            throw new Error("Não foi possível consultar os pedidos.");
        }

        const pedidos = await resposta.json();

        if(!pedidos){

            pedidoDiv.innerHTML =
            '<div class="vazio">Nenhum pedido de viagem disponível.</div>';

            return;
        }

        const lista = Object.values(pedidos);

        const pedidoEncontrado = lista.find(pedido =>
            pedido &&
            pedido.status === "A procurar mototaxista..." &&
            pedido.id !== pedidoRecusadoId
        );

        if(!pedidoEncontrado){

            if(viagemAceiteId){
                return;
            }

            pedidoDiv.innerHTML =
            '<div class="vazio">Nenhum pedido novo disponível.</div>';

            return;
        }

        mostrarPedido(pedidoEncontrado);

    }catch(error){

        console.error("Erro ao carregar pedidos:", error);

        pedidoDiv.innerHTML =
        '<div class="vazio">Erro ao procurar pedidos. Tenta novamente.</div>';
    }
}


function mostrarPedido(pedido){

    pedidoDiv.innerHTML = `

        <div class="info">

            📍 <b>Destino:</b>
            ${pedido.destinationName || "Não informado"}<br>

            💳 <b>Pagamento:</b>
            ${pedido.payment || "Não informado"}<br>

            📏 <b>Distância:</b>
            ${pedido.distanceKm || "0"} km<br>

            💰 <b>Tarifa:</b>
            ${pedido.estimatedFare || "0"} MT

        </div>

        <div class="status">

            🟡 Passageiro está à procura de um mototaxista.

        </div>

        <button onclick="aceitarViagem('${pedido.id}')">

            🟢 ACEITAR VIAGEM

        </button>

        <button
            onclick="recusarViagem('${pedido.id}')"
            style="background:#b00020;">

            🔴 RECUSAR VIAGEM

        </button>
    `;
}


async function aceitarViagem(id){

    try{

        const respostaPedido =
            await fetch(firebaseBase + encodeURIComponent(id) + ".json");

        if(!respostaPedido.ok){
            throw new Error("Não foi possível obter o pedido.");
        }

        const pedido = await respostaPedido.json();

        if(!pedido){

            alert("Este pedido já não está disponível.");
            carregarPedidos();
            return;
        }

        if(pedido.status !== "A procurar mototaxista..."){

            alert("Este pedido já foi aceite por outro mototaxista.");

            carregarPedidos();
            return;
        }

        pedido.status = "Mototaxista encontrado";

        pedido.driverAcceptedAt = new Date().toISOString();

        const respostaAtualizacao = await fetch(
            firebaseBase + encodeURIComponent(id) + ".json",
            {
                method: "PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body: JSON.stringify(pedido)
            }
        );

        if(!respostaAtualizacao.ok){
            throw new Error("Não foi possível atualizar o pedido.");
        }

        localStorage.setItem(
            "tchovaTripRequest",
            JSON.stringify(pedido)
        );

        viagemAceiteId = id;

        pedidoDiv.innerHTML = `

            <div class="status">

                🟢 <b>VIAGEM ACEITE!</b><br><br>

                O mototaxista aceitou o pedido do passageiro.

            </div>

        `;

    }catch(error){

        console.error(error);

        alert(
            "Não foi possível aceitar a viagem. Tenta novamente."
        );
    }
}


function recusarViagem(id){

    pedidoRecusadoId = id;

    pedidoDiv.innerHTML = `

        <div class="status">

            🔴 <b>Pedido recusado.</b><br><br>

            A procurar outros pedidos...

        </div>

    `;

}


carregarPedidos();

setInterval(carregarPedidos, 3000);
</script>

</body>
  </html>
